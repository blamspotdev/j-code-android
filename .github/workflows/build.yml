name: build

# Compiles the app on every pull request and on every push to main.
#
# Until this existed nothing in the repository ever compiled the code: release.yml and
# version-bump.yml are both `workflow_dispatch`, so a hand-dispatched release was the first thing
# that ever built main. #70 merged a reference to a file that had never been committed; main stopped
# compiling, and it surfaced hours later as a failed beta rather than as a failed PR.
#
# It **compiles** rather than assembles. The failure this guards against is an unresolved symbol, and
# stopping at compilation keeps the check short enough to sit on every push without anyone routing
# around it. Packaging, lint and tests are deliberately not here — a check people wait on is a check
# people learn to ignore.
#
# The **release** variant, for two reasons: it is the one a release builds, so this fails where a
# release would; and cargo builds `arm64-v8a` alone for release where debug also builds `x86_64`
# (gradle/cargo.gradle.kts), which is a whole second native toolchain run for no extra coverage.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android SDK, the NDK and two Rust target directories do not fit beside the runner's
      # preinstalled toolchains.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # The same pins release.yml installs, so this compiles against what a release compiles against.
      - name: Install the SDK pieces the build pins
        run: |
          set -eu
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

          # CMake is deliberately NOT installed: native/CMakeLists.txt needs 3.24+, the SDK's default
          # is 3.22.1, and the resolver in the root build.gradle.kts would discard it. The runner
          # image ships a usable one — this only checks that it still does, because the resolver's
          # fallback names a version the SDK does not publish and the failure surfaces much later as
          # something else entirely.
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::ANDROID_HOME is unset"; exit 1; }
          usable="$(ls "$ANDROID_HOME/cmake" 2>/dev/null | awk -F. '$1 * 100000 + $2 >= 300024' | tail -1)"
          [ -n "$usable" ] || {
            echo "::error::no installed CMake is 3.24 or above; native/CMakeLists.txt cannot configure"
            ls "$ANDROID_HOME/cmake" 2>/dev/null || true
            exit 1
          }

      # Not optional, even though nothing here packages a library: :app:compileReleaseKotlin pulls
      # :native:ripgrep-ffi:cargoBuildReleaseJniLibs into its task graph, because the root
      # build.gradle.kts decides what the native modules contribute from whether cargo is on the
      # machine — and on this runner it is.
      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/ripgrep-ffi/rust/target
            native/wasmtime-ffi/rust/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Compile
        run: ./gradlew --no-daemon :app:compileReleaseKotlin
