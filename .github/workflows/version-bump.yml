name: version bump

# Opens the next release train on `main`.
#
# `val jcodeVersion` in app/build.gradle.kts is the version being *prepared*, not the last one
# shipped — main carries an open train, previews of it are built as 1.5.0-beta.N, and 1.5.0 is
# published from the same commits when it is ready. So the bump belongs after a release goes out,
# not after a merge: bumping per-merge would move the target every time somebody landed a PR, and
# there would never be a version long enough for a preview to be a preview *of* anything.
#
# **Dispatched, never triggered by an event.** release.yml asks for this at the end of a stable
# publish, which is the only automatic path; running it by hand is the other, and that is
# admin-only. It used to also listen for `release: published`, and that trigger has been removed
# for three reasons at once: a release created with GITHUB_TOKEN raises no such event to begin with,
# a `release` run's ref is the *tag* so the environment below would refuse it anyway, and anyone
# with push access can publish a release — which made it the one way into this workflow that was
# not admin-gated.
#
# ## How it reaches `main`
#
# The `protect-main` ruleset requires a pull request, and binds every actor that is not on its
# bypass list. **"Repository admin" is on that list**, so this pushes directly using a PAT in
# `secrets.VERSION_BUMP_TOKEN`.
#
# That PAT is an **environment** secret on `version-bump`, not a repository secret. A repository
# secret is readable by a workflow on *any* branch, so anyone with push access could have taken it
# and pushed to `main` themselves — the exact rule it exists to bypass. The environment's
# deployment branch policy is `main` alone, so a run dispatched from a branch cannot read it.
#
# Without the PAT the push is refused and the run falls back to offering the bump as a PR on
# `chore/bump-version`; nothing is lost, it just needs merging by hand. The run summary says which
# path it took.
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Which part of the version to raise'
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

# Two releases can be published in quick succession; queue the runs instead of cancelling so each
# one sees the previous bump rather than racing it.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Where the PAT lives, and the reason it is not a repository secret — see the header. The
    # environment carries no reviewers: this is the tail end of a release that has already been
    # approved, and a second gate here would only leave `main` carrying a version that has shipped.
    environment: version-bump
    steps:
      # This job pushes to `main` under a repository-admin PAT, so who may start it by hand is the
      # same question as who may publish — see release.yml.
      #
      # Only a person can fail this. The one automatic path has nobody behind it: release.yml opens
      # the next train by dispatching this workflow as `github-actions[bot]`, which is not a
      # collaborator and has no permission level to look up.
      - name: Refuse anyone but an admin
        if: ${{ !endsWith(github.actor, '[bot]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          level="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            --jq '.permission' 2>/dev/null || true)"
          if [ -z "$level" ]; then
            echo "::error::cannot read $GITHUB_ACTOR's permission level — the workflow token may be too narrow to query collaborators"
            exit 1
          fi
          if [ "$level" != "admin" ]; then
            echo "::error::$GITHUB_ACTOR has '$level' access; opening a release train is admin-only"
            exit 1
          fi
          echo "$GITHUB_ACTOR is an admin."

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # The environment's PAT, which "Repository admin" on the ruleset's bypass list lets push
          # to `main`. Falls through to the built-in token when the secret is absent — that push is
          # refused and the run offers the bump as a PR instead, which is a working release rather
          # than a broken one.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      # release.yml dispatches this with `minor` after a stable publish; a run by hand picks its
      # own. Anything unrecognised stays minor rather than guessing high.
      - name: Choose bump level
        id: level
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          set -eu
          level="${DISPATCH_LEVEL:-minor}"
          case "$level" in patch | minor | major) : ;; *) level=minor ;; esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Bump level: $level"

      - name: Bump main
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/bump-version
          LEVEL: ${{ steps.level.outputs.level }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blocked=0

          # Says why the train was opened, so `main` does not read as a run of bare version markers
          # with nothing saying what moved each one. A bot on the handle means release.yml asked for
          # this at the end of a stable publish; anyone else ran it themselves.
          case "$ACTOR" in
            *'[bot]') why="Opening the next train after a stable release." ;;
            *) why="Opening the next train ($LEVEL bump, run by $ACTOR)." ;;
          esac

          # Recomputed from the current tip on every attempt: another run may have bumped main
          # since this one started, and replaying a stale bump would reuse a version number.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            version="$(sh scripts/bump-version.sh "$LEVEL")"
            git commit --quiet -am "Open the $version train" -m "$why"

            if git push origin HEAD:main 2>push.err; then
              echo "main is now preparing $version"
              echo "main is now preparing **$version**. $why" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat push.err

            # A ruleset refusal will not go away by retrying; losing a race to another run will.
            if grep -qEi 'protected branch|through a pull request|rule violations|GH006' push.err; then
              blocked=1
              break
            fi
            echo "Push rejected (attempt $attempt) — refetching and recomputing."
          done

          if [ "$blocked" -ne 1 ]; then
            echo "Could not push the bump to main after 3 attempts." >&2
            exit 1
          fi

          # main is protected against us: offer the bump as a PR instead. The commit and $version
          # from the loop above are still in place.
          git push --force origin HEAD:"$BRANCH"

          # Dedented on the way out: the heredoc sits inside an indented YAML block scalar, and
          # those ten leading spaces would reach GitHub as an indented code block rather than as
          # the prose it is.
          body="$(sed 's/^          //' <<EOF
          $why main now prepares $version.

          The direct push to main was refused by the protect-main ruleset, so the bump is here
          instead. Normally it does not come through a PR at all — check that
          VERSION_BUMP_TOKEN is still on the \`version-bump\` environment and that
          "Repository admin" is still on the ruleset's bypass list.

          versionCode derives from the semver ((MAJOR*10000 + MINOR*100 + PATCH) * 100 + tier), so
          this one line is the whole change; the specifications that state the product version move
          with it.

          Previews of this train are built as $version-beta.N by the release workflow; publishing
          $version itself is what opens the train after this one.
          EOF
          )"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          opened=0
          if [ -n "$existing" ]; then
            if gh pr edit "$existing" --title "Open the $version train" --body "$body"; then
              opened=1
            fi
          elif gh pr create --base main --head "$BRANCH" --title "Open the $version train" --body "$body"; then
            opened=1
          fi

          {
            echo "### main was not bumped — the bump is waiting on a PR"
            echo
            echo "This is the fallback, not the normal path: the bump should push straight to main."
            echo "The \`protect-main\` ruleset refused it, so **$version** is on \`$BRANCH\` —"
            echo "[open the PR]($compare) and merge it, and main is on the new train."
            echo
            echo "Two things to check so the next one does not need this:"
            echo "- \`VERSION_BUMP_TOKEN\` is still a secret on the **version-bump** environment"
            echo "  (a repository secret of the same name is *not* enough — the job reads the"
            echo "  environment's, and this run may have found neither)."
            echo "- **Repository admin** is still on **Settings > Rules > protect-main > Bypass list**."
            if [ "$opened" -ne 1 ]; then
              echo
              echo "(The branch is pushed but the PR could not be opened — that needs"
              echo "*Settings > Actions > General > Allow GitHub Actions to create and approve pull requests*.)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
