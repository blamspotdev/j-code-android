name: version bump

# Bumps the patch version on `main` after every merged PR, so nobody has to remember it
# (main has merged a feature batch unbumped more than once — see the #28 and #34 bump PRs).
#
# **This needs a bypass actor on the `protect-main` ruleset.** That ruleset requires a pull
# request and, with no bypass actors, binds every actor — admins and GITHUB_TOKEN included —
# so a direct push to `main` is refused. Add one under
# Settings > Rules > protect-main > Bypass list:
#
#   - the "GitHub Actions" app, to let the built-in GITHUB_TOKEN through, or
#   - "Repository admin" if you run this with a PAT in secrets.VERSION_BUMP_TOKEN.
#
# Until that exists the push is rejected and the run falls back to offering the bump as a PR
# on `chore/bump-version`, so merges keep working and the version is never lost. The run
# summary says which path it took.
#
# Note: pushes made with GITHUB_TOKEN do not trigger other workflows, so a direct bump will
# not re-run this workflow (no loop) and will not re-run the no-host-root guard either. A PAT
# in VERSION_BUMP_TOKEN does trigger them; that is still no loop — a push cannot fire
# `pull_request`.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Merges can land in quick succession; queue the runs instead of cancelling so each one sees
# the previous bump rather than racing it.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-bump'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A PAT (paired with a "Repository admin" bypass) if you have one; the built-in
          # token otherwise, which needs the GitHub Actions app on the bypass list instead.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      - name: Skip when the merged PR moved the version itself
        id: guard
        if: github.event_name == 'pull_request'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -eu
          version_at() {
            git show "$1:app/build.gradle.kts" 2>/dev/null \
              | sed -n 's/^val jcodeVersion = "\([^"]*\)".*/\1/p' | head -1
          }
          # First parent of the merge/squash commit is the previous main tip either way.
          before="$(version_at "$MERGE_SHA^")"
          after="$(version_at "$MERGE_SHA")"
          if [ -z "$before" ] || [ -z "$after" ]; then
            echo "Could not read the version around $MERGE_SHA; bumping anyway."
          elif [ "$before" != "$after" ]; then
            echo "This PR already bumped $before -> $after; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump main
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/bump-version
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blocked=0

          # Recomputed from the current tip on every attempt: another merge may have bumped main
          # since this run started, and replaying a stale bump would reuse a version number.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            version="$(sh scripts/bump-patch-version.sh)"
            git commit --quiet -am "Bump version to $version" -m "Pushed automatically after a merge to main. versionCode derives from the semver in app/build.gradle.kts, so this single line is the whole change; the specifications that state the product version move with it."

            if git push origin HEAD:main 2>push.err; then
              echo "main bumped to $version"
              echo "main bumped to $version." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat push.err

            # A ruleset refusal will not go away by retrying; losing a race to another run will.
            if grep -qEi 'protected branch|through a pull request|rule violations|GH006' push.err; then
              blocked=1
              break
            fi
            echo "Push rejected (attempt $attempt) — refetching and recomputing."
          done

          if [ "$blocked" -ne 1 ]; then
            echo "Could not push the bump to main after 3 attempts." >&2
            exit 1
          fi

          # main is protected against us: offer the bump as a PR instead. The commit and $version
          # from the loop above are still in place.
          git push --force origin HEAD:"$BRANCH"

          body="$(cat <<EOF
          Automatic patch bump to $version, pushed after a merge to main.

          The workflow tried to bump main directly and was refused by the protect-main ruleset.
          Add a bypass actor (Settings > Rules > protect-main > Bypass list) and future merges
          will bump main without going through a PR.

          versionCode derives from the semver (MAJOR*10000 + MINOR*100 + PATCH), so this one line
          is the whole change; the specifications that state the product version move with it.

          To skip the bump for a PR, label it skip-bump. A PR that changes jcodeVersion itself is
          detected and skipped.
          EOF
          )"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          opened=0
          if [ -n "$existing" ]; then
            if gh pr edit "$existing" --title "Bump version to $version" --body "$body"; then
              opened=1
            fi
          elif gh pr create --base main --head "$BRANCH" --title "Bump version to $version" --body "$body"; then
            opened=1
          fi

          {
            echo "### main could not be bumped directly"
            echo
            echo "The protect-main ruleset refused the push, so the bump to $version is on"
            echo "$BRANCH instead — [open the PR]($compare)."
            echo
            echo "To have merges bump main itself, add a bypass actor under **Settings > Rules >"
            echo "protect-main > Bypass list**: the **GitHub Actions** app for the built-in token,"
            echo "or **Repository admin** if you put a PAT in VERSION_BUMP_TOKEN."
            if [ "$opened" -ne 1 ]; then
              echo
              echo "(Opening the PR also needs *Allow GitHub Actions to create and approve pull requests*.)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
