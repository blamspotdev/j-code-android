name: version bump

# Opens the next release train on `main`.
#
# `val jcodeVersion` in app/build.gradle.kts is the version being *prepared*, not the last one
# shipped — main carries an open train, previews of it are built as 1.5.0-beta.N, and 1.5.0 is
# published from the same commits when it is ready. So the bump belongs after a release goes out,
# not after a merge: bumping per-merge would move the target every time somebody landed a PR, and
# there would never be a version long enough for a preview to be a preview *of* anything.
#
# Runs when a **stable** release is published, and only when the version that shipped is the one
# main is carrying (see the guard) — so a hotfix published off an older line never advances the
# open train. Can also be run by hand from the Actions tab for any level, which is how you open a
# major train or correct a mistake.
#
# **This needs a bypass actor on the `protect-main` ruleset.** That ruleset requires a pull
# request and, with no bypass actors, binds every actor — admins and GITHUB_TOKEN included —
# so a direct push to `main` is refused. Add one under
# Settings > Rules > protect-main > Bypass list:
#
#   - the "GitHub Actions" app, to let the built-in GITHUB_TOKEN through, or
#   - "Repository admin" if you run this with a PAT in secrets.VERSION_BUMP_TOKEN.
#
# Until that exists the push is rejected and the run falls back to offering the bump as a PR
# on `chore/bump-version`, so releases keep working and the version is never lost. The run
# summary says which path it took.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      level:
        description: 'Which part of the version to raise'
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

# Two releases can be published in quick succession; queue the runs instead of cancelling so each
# one sees the previous bump rather than racing it.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    # A pre-release never opens the next train: 1.5.0-beta.2 is a preview *of* the version main is
    # already carrying, so moving main on would strand it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A PAT (paired with a "Repository admin" bypass) if you have one; the built-in
          # token otherwise, which needs the GitHub Actions app on the bypass list instead.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      # The train that just shipped has to be the one main is carrying. A hotfix released off an
      # older line (v1.4.11 while main prepares 1.5.0) is not the end of main's train, and bumping
      # for it would skip 1.5.0 entirely — the version every open preview is a preview of.
      - name: Skip a release that is not main's open train
        id: guard
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          released="$(printf '%s' "${TAG#v}" | tr -d ' ')"
          carrying="$(sed -n 's/^val jcodeVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "released: $released | main is carrying: $carrying"
          if [ "$released" != "$carrying" ]; then
            echo "Not main's open train; leaving $carrying alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "\`$released\` is not main's open train (\`$carrying\`) — no bump." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A published release opens the next MINOR train. A manual run picks the level itself;
      # anything unrecognised stays minor rather than guessing high.
      - name: Choose bump level
        id: level
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          set -eu
          level="${DISPATCH_LEVEL:-minor}"
          case "$level" in patch | minor | major) : ;; *) level=minor ;; esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Bump level: $level"

      - name: Bump main
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/bump-version
          LEVEL: ${{ steps.level.outputs.level }}
          SHIPPED: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blocked=0

          # Says what the train was opened after, so `main` does not read as a run of bare version
          # markers with nothing saying why each one moved.
          if [ -n "${SHIPPED:-}" ]; then
            why="Opening the next train after $SHIPPED."
          else
            why="Opening the next train (manual $LEVEL bump)."
          fi

          # Recomputed from the current tip on every attempt: another run may have bumped main
          # since this one started, and replaying a stale bump would reuse a version number.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            version="$(sh scripts/bump-version.sh "$LEVEL")"
            git commit --quiet -am "Open the $version train" -m "$why"

            if git push origin HEAD:main 2>push.err; then
              echo "main is now preparing $version"
              echo "main is now preparing **$version**. $why" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat push.err

            # A ruleset refusal will not go away by retrying; losing a race to another run will.
            if grep -qEi 'protected branch|through a pull request|rule violations|GH006' push.err; then
              blocked=1
              break
            fi
            echo "Push rejected (attempt $attempt) — refetching and recomputing."
          done

          if [ "$blocked" -ne 1 ]; then
            echo "Could not push the bump to main after 3 attempts." >&2
            exit 1
          fi

          # main is protected against us: offer the bump as a PR instead. The commit and $version
          # from the loop above are still in place.
          git push --force origin HEAD:"$BRANCH"

          # Dedented on the way out: the heredoc sits inside an indented YAML block scalar, and
          # those ten leading spaces would reach GitHub as an indented code block rather than as
          # the prose it is.
          body="$(sed 's/^          //' <<EOF
          $why main now prepares $version.

          The workflow tried to bump main directly and was refused by the protect-main ruleset.
          Add a bypass actor (Settings > Rules > protect-main > Bypass list) and future releases
          will open the next train without going through a PR.

          versionCode derives from the semver ((MAJOR*10000 + MINOR*100 + PATCH) * 100 + tier), so
          this one line is the whole change; the specifications that state the product version move
          with it.

          Previews of this train are built as $version-beta.N by the release workflow; publishing
          $version itself is what opens the train after this one.
          EOF
          )"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          opened=0
          if [ -n "$existing" ]; then
            if gh pr edit "$existing" --title "Open the $version train" --body "$body"; then
              opened=1
            fi
          elif gh pr create --base main --head "$BRANCH" --title "Open the $version train" --body "$body"; then
            opened=1
          fi

          {
            echo "### main could not be bumped directly"
            echo
            echo "The protect-main ruleset refused the push, so the bump to $version is on"
            echo "$BRANCH instead — [open the PR]($compare)."
            echo
            echo "To have releases open the next train themselves, add a bypass actor under"
            echo "**Settings > Rules > protect-main > Bypass list**: the **GitHub Actions** app for"
            echo "the built-in token, or **Repository admin** if you put a PAT in VERSION_BUMP_TOKEN."
            if [ "$opened" -ne 1 ]; then
              echo
              echo "(Opening the PR also needs *Allow GitHub Actions to create and approve pull requests*.)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
