name: release

# Builds, signs and publishes a JCode APK — the whole of what scripts/build-release-*.sh does
# locally, plus the tag and the GitHub release the in-app updater reads.
#
# The version is NOT an input. It is read from `val jcodeVersion` in app/build.gradle.kts — the
# train main is currently carrying — so a release can only ever publish the version the repository
# says it is preparing. What you choose here is which *channel* it goes out on:
#
#   beta   -> dev.jcode.beta, versionName 1.5.0-beta.1, tagged v1.5.0-beta.1, marked pre-release.
#             Installs alongside the release app; the Beta channel of the updater offers it.
#   stable -> dev.jcode,      versionName 1.5.0,        tagged v1.5.0,        a full release.
#             Publishing one also opens the next train (see version-bump.yml).
#
# ## Who may run this, and the secrets it needs
#
# The signing key cannot be rotated without every installed app having to be uninstalled first, so
# it is the most sensitive thing in the repository. It lives in the **`release` environment**, not in
# repository secrets — repository secrets are readable by a workflow running on *any* branch, which
# would let anyone with push access take the keystore by dispatching a branch of their own.
#
# The environment is configured with:
#
#   - **Required reviewers**: the repo admin. A run by anyone else waits and never starts.
#   - **Allow administrators to bypass**: on, so an admin's own release is not held up.
#   - **Deployment branches**: `main` only, which is what closes the pushed-branch route.
#
# Its four secrets:
#
#   RELEASE_KEYSTORE_BASE64    base64 of the .jks    (base64 -w0 jcode.jks)
#   RELEASE_KEYSTORE_PASSWORD  its store password
#   RELEASE_KEY_ALIAS          the key alias         (the local scripts create "jcode")
#   RELEASE_KEY_PASSWORD       the key password      (same as the store password by default)
#
# Without them the build still runs and the APK is produced, but the publish step fails rather
# than shipping something unsigned that nobody can install.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to publish'
        type: choice
        options: [beta, stable]
        default: beta
      label:
        description: 'Blank = the next beta. Or a tier (alpha|beta|rc) for the next in that line, or an exact alpha.N|beta.N|rc.N. Ignored for stable.'
        type: string
        default: ''

permissions:
  contents: write

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  # A job of its own, ahead of the one that matters, so somebody without the rights is told so in
  # seconds. The `release` environment would stop them anyway — but it stops them by *waiting* for an
  # approval that is never coming, which reads as a queue rather than as a refusal.
  #
  # This is the courtesy, not the control. Anyone with push access can dispatch a branch whose
  # workflow has this job removed; what they cannot do is reach the signing key, because it lives in
  # the environment below and that environment only accepts deployments from `main`.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anyone but an admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          level="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            --jq '.permission' 2>/dev/null || true)"
          # Refused rather than waved through when the answer cannot be read at all: this decides
          # who may sign a release with a key that cannot be rotated without every user reinstalling.
          if [ -z "$level" ]; then
            echo "::error::cannot read $GITHUB_ACTOR's permission level — the workflow token may be too narrow to query collaborators"
            exit 1
          fi
          if [ "$level" != "admin" ]; then
            echo "::error::$GITHUB_ACTOR has '$level' access; publishing a signed release is admin-only"
            exit 1
          fi
          echo "$GITHUB_ACTOR is an admin."

  publish:
    needs: guard
    runs-on: ubuntu-latest
    # Where the signing secrets live, and the reason they are not repository secrets: those are
    # readable by a workflow on *any* branch, so a pushed branch could take the keystore. This
    # environment is restricted to `main` and gated on an admin's approval, which is what makes
    # "admin-only" a rule rather than a request.
    environment: release
    # The Rust side builds wasmtime from source; a cold cache is slow, and failing at 60 minutes
    # with no artefact is worse than waiting.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Everything downstream reads these, so they are worked out once, here, from the same rules
      # the local scripts use — see scripts/build-release-common.sh.
      # Everything downstream reads these, and the whole of it is worked out before anything
      # expensive runs — a build that cannot be published should fail in seconds, not in an hour.
      - name: Work out what is being published
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          LABEL: ${{ inputs.label }}
        run: |
          set -eu
          version="$(sed -n 's/^val jcodeVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$version" ] || { echo "::error::no 'val jcodeVersion' in app/build.gradle.kts"; exit 1; }

          # versionCode = (MAJOR*10000 + MINOR*100 + PATCH) * 100 + tier.
          # MUST MATCH app/build.gradle.kts, build-release-common.sh and build-release.ps1.
          version_code() {
            echo "$1" | awk -v label="$2" -F. '{
                base = $1 * 10000 + $2 * 100 + $3
                step = 0
                if (match(label, /[0-9]+$/)) step = substr(label, RSTART, RLENGTH) + 0
                if (label ~ /^alpha/)     tier = step
                else if (label ~ /^beta/) tier = 30 + step
                else if (label ~ /^rc/)   tier = 60 + step
                else                      tier = 99
                if (tier > 99) tier = 99
                if (tier < 0)  tier = 0
                printf "%d", base * 100 + tier
            }'
          }

          # What this train has already published. The number in a label is derivable from it, and
          # anything derivable is not somebody's job to remember.
          published="$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          escaped="$(printf '%s' "$version" | sed 's/\./\\./g')"

          if [ "$CHANNEL" = "beta" ]; then
            # Blank asks for the next beta; a bare tier asks for the next in that line; a full
            # label pins one exactly. Anything else is refused rather than accepted-and-mangled —
            # an unrecognised label falls to the release tier in the derivation above, so a preview
            # would take the very version code of the release it is previewing.
            case "${LABEL:-}" in
              '')                tier="beta";          step="" ;;
              alpha | beta | rc) tier="$LABEL";        step="" ;;
              alpha.[0-9]* | beta.[0-9]* | rc.[0-9]*)
                                 tier="${LABEL%%.*}";  step="${LABEL#*.}" ;;
              *)
                echo "::error::label must be blank, a tier (alpha|beta|rc), or alpha.N|beta.N|rc.N — got '$LABEL'"
                exit 1
                ;;
            esac
            if [ -z "$step" ]; then
              # One past the highest already out in this line. A new train starts back at 1 by
              # itself, because v1.6.0-beta.* is a different prefix from v1.5.0-beta.*.
              highest="$(printf '%s\n' "$published" \
                | sed -n "s/^v${escaped}-${tier}\.\([0-9][0-9]*\)$/\1/p" \
                | sort -n | tail -1)"
              step="$(( ${highest:-0} + 1 ))"
            fi
            label="$tier.$step"
            version_name="$version-$label"
            id_suffix=".beta"
            variant="beta"
          else
            label=""
            version_name="$version"
            id_suffix=""
            variant="release"
          fi
          code="$(version_code "$version" "$label")"

          # Nothing already published for this train may be at or above what is about to be built.
          # That covers republishing a label — which `gh release create` would only reject at the
          # very last step, an hour in — and, for a label given by hand, going *backwards*: a tag
          # check cannot see that one, and it would put a lower version code on devices already
          # carrying a higher one.
          for tag in $published; do
            case "$tag" in
              "v$version" | "v$version"-*) : ;;
              *) continue ;;
            esac
            other="${tag#v$version}"
            other="${other#-}"
            other_code="$(version_code "$version" "$other")"
            if [ "$other_code" -ge "$code" ]; then
              echo "::error::$tag is already published at versionCode $other_code, and v$version_name would be $code — a release has to climb above everything before it."
              exit 1
            fi
          done

          {
            echo "version_name=$version_name"
            echo "code=$code"
            echo "id_suffix=$id_suffix"
            echo "variant=$variant"
            echo "tag=v$version_name"
            echo "apk=jcode-v$version_name-$code-$variant.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing **v$version_name** ($code) on the \`$CHANNEL\` channel." >> "$GITHUB_STEP_SUMMARY"

      # wasmtime's build tree plus the NDK is more than the runner has spare with the preinstalled
      # toolchains still on it. These two are the large ones JCode does not use.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install the SDK pieces the build pins
        run: |
          set -eu
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

          # CMake is deliberately NOT installed here. `native/CMakeLists.txt` uses
          # `$<LINK_LIBRARY:WHOLE_ARCHIVE,…>`, so the resolver in the root build.gradle.kts discards
          # everything below 3.24 — `cmake;3.22.1`, the version the SDK installs by default,
          # included. Asking for it would add a download the build then refuses to use. The runner
          # image already ships a usable one; this only checks that it does, because the resolver's
          # fallback names a version the SDK does not publish and the failure would surface much
          # later as something else entirely.
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::ANDROID_HOME is unset"; exit 1; }
          usable="$(ls "$ANDROID_HOME/cmake" 2>/dev/null | awk -F. '$1 * 100000 + $2 >= 300024' | tail -1)"
          [ -n "$usable" ] || {
            echo "::error::no installed CMake is 3.24 or above; native/CMakeLists.txt cannot configure"
            ls "$ANDROID_HOME/cmake" 2>/dev/null || true
            exit 1
          }
          echo "CMake the build will use: $usable"

      # cargo-ndk cross-compiles the Rust FFI crates against the NDK; gradle/cargo.gradle.kts shells
      # out to it and builds arm64-v8a only for release.
      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/ripgrep-ffi/rust/target
            native/wasmtime-ffi/rust/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      # A separate invocation, exactly as the local scripts do it: assembleRelease's configuration
      # then sees the built libraries and drops the CMake stub for the Rust modules (see the root
      # build.gradle.kts). Built in the same run, so a stub can never reach a published APK.
      - name: Build the Rust JNI libraries
        run: ./gradlew --no-daemon :native:ripgrep-ffi:cargoBuildReleaseJniLibs :native:wasmtime-ffi:cargoBuildReleaseJniLibs

      - name: Assemble the release APK
        env:
          VERSION_NAME: ${{ steps.v.outputs.version_name }}
          ID_SUFFIX: ${{ steps.v.outputs.id_suffix }}
        run: |
          set -eu
          # if/fi rather than `[ … ] && …`: that form returns the test's status, and a false test
          # under `set -e` would end the step rather than skip the argument.
          if [ -n "$ID_SUFFIX" ]; then
            ./gradlew --no-daemon :app:assembleRelease \
              "-PjcodeVersionName=$VERSION_NAME" "-PjcodeIdSuffix=$ID_SUFFIX"
          else
            ./gradlew --no-daemon :app:assembleRelease "-PjcodeVersionName=$VERSION_NAME"
          fi

      # The same apksigner call the local scripts make. Passwords go in through `env:` rather than
      # `pass:` so they are never a command-line argument.
      - name: Sign it
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          JCODE_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          JCODE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APK_NAME: ${{ steps.v.outputs.apk }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${JCODE_KS_PASS:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD are not set."
            echo "::error::An unsigned APK cannot be installed, so nothing is published."
            exit 1
          fi
          unsigned="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$unsigned" ] || { echo "::error::no APK in app/build/outputs/apk/release"; exit 1; }

          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          build_tools="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          mkdir -p builds
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:JCODE_KS_PASS \
            ${KEY_ALIAS:+--ks-key-alias "$KEY_ALIAS"} \
            ${JCODE_KEY_PASS:+--key-pass env:JCODE_KEY_PASS} \
            --out "builds/$APK_NAME" "$unsigned"
          rm -f "$keystore"

          # Proves the artefact about to be published is installable, rather than assuming the
          # signer succeeded because it exited zero.
          "$build_tools/apksigner" verify --print-certs "builds/$APK_NAME"
          echo "sha256=$(sha256sum "builds/$APK_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          APK_NAME: ${{ steps.v.outputs.apk }}
          VARIANT: ${{ steps.v.outputs.variant }}
          CODE: ${{ steps.v.outputs.code }}
          SHA256: ${{ steps.sign.outputs.sha256 }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          if [ "$CHANNEL" = "beta" ]; then
            installs_as="dev.jcode.beta, alongside the release app"
          else
            installs_as="dev.jcode"
          fi

          # printf rather than a heredoc: everything here is inside an indented YAML block scalar,
          # and a heredoc would keep that indentation — ten leading spaces, which GitHub renders as
          # a code block rather than as the note it is.
          notes="$(printf '%s\n' \
            "Installs as \`$installs_as\` — versionCode \`$CODE\`." \
            "" \
            "\`$APK_NAME\`" \
            "SHA-256: \`$SHA256\`")"

          # --target creates the tag on this commit as part of publishing, so a failed build never
          # leaves a tag behind pointing at a release that does not exist. Custom notes sit above
          # the generated changelog.
          #
          # A function rather than a `$pre` variable holding "--prerelease" or "": an empty variable
          # still expands to an empty argument, which `gh` would read as a second asset path.
          publish() {
            gh release create "$TAG" "builds/$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --notes "$notes" \
              "$@"
          }
          if [ "$CHANNEL" = "beta" ]; then publish --prerelease; else publish; fi

          {
            echo "Published **$TAG** on the \`$CHANNEL\` channel."
            echo ""
            echo "- versionCode \`$CODE\`"
            echo "- SHA-256 \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.apk }}
          path: builds/${{ steps.v.outputs.apk }}
          if-no-files-found: error
