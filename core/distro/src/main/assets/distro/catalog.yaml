entries:
  - id: clangd
    category: languages
    # This entry is the COMPILER only. clangd itself is the language-server catalog's entry of the
    # same name, and LLDB belongs to the lldb-dap debug engine — when this entry shipped all three,
    # the Toolchains list showed what looked like the same tool twice and each install redid the
    # other's work. The id stays "clangd" because it keys the persisted installed-set and the C/C++
    # Dev Pack names it in suggests.sdks.
    name: Clang (C/C++ compiler)
    description: The clang compiler, clang-format, and gdb for building and debugging C-family projects. The clangd language server and the LLDB debugger are separate entries.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing the C/C++ compiler" clang clang-format gdb
    verifyScript: |
      command -v clang >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y clang clang-format gdb
    # (-[0-9]+)? also matches the versioned llvm-toolchain packages (clang-18, …) that carry the
    # actual updates; the unversioned metas almost never rev within a release. It cannot match
    # clangd/ — after "clang" the optional -NN matches empty and "/" would have to match "d".
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(clang|clang-format|gdb)(-[0-9]+)?/'"

  - id: python
    category: languages
    name: Python
    description: Installs Python 3, venv support, and pip for app and script projects.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing Python" python3 python3-venv python3-pip
    verifyScript: |
      command -v python3 >/dev/null 2>&1 && python3 -m venv /tmp/_jcodevenv >/dev/null 2>&1 && rm -rf /tmp/_jcodevenv && echo ready
    uninstallScript: |
      sudo apt-get remove -y python3 python3-venv python3-pip
    # Versioned interpreter packages (python3.12, python3.12-venv, libpython3.12-stdlib) carry the
    # real updates; the python3/python3-venv metas almost never rev within a release.
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(python3(\\.[0-9]+)?(-venv|-pip|-minimal)?|libpython3[^/]*)/'"

  - id: nodejs
    category: languages
    name: Node.js
    description: Node.js runtimes and npm managed with nvm — install multiple versions side by side; the newest installed is the default on PATH.
    multiVersion: true
    # Managed with nvm so several Node versions coexist. nvm is a shell function (not a binary on PATH),
    # and JCode's terminals / build-run use `sh -c` without sourcing a profile — so after install the
    # default version's node/npm/npx/corepack are symlinked into /usr/local/bin to keep them on PATH.
    # nvm ships upstream (unpatched) npm, avoiding Ubuntu's Debian-patched npm which fails under proot
    # with a phantom `mkdir '/home' ENOENT`. "Newest installed" is kept as the default.
    installScript: |
      set -e
      export NVM_DIR="$HOME/.nvm"
      command -v curl >/dev/null 2>&1 || jcode_apt 0 10 "Installing download prerequisites" curl ca-certificates
      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
        jcode_progress 15 "Installing nvm"
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      fi
      . "$NVM_DIR/nvm.sh"
      jcode_progress 30 "Downloading Node.js ${JCODE_VERSION:-LTS}"
      # A version chosen in the picker arrives as JCODE_VERSION; otherwise install the newest LTS.
      if [ -n "${JCODE_VERSION:-}" ]; then nvm install "$JCODE_VERSION"; else nvm install --lts; fi
      # Keep the newest installed version as the default and expose it on PATH via /usr/local/bin.
      jcode_progress 90 "Selecting the default Node.js"
      DEFAULT_VER="$(nvm version node)"
      nvm alias default "$DEFAULT_VER"
      DEFAULT_DIR="$NVM_DIR/versions/node/$DEFAULT_VER"
      for b in node npm npx corepack; do
        if [ -x "$DEFAULT_DIR/bin/$b" ]; then sudo ln -sf "$DEFAULT_DIR/bin/$b" "/usr/local/bin/$b"; fi
      done
      jcode_progress 100 "Node.js $DEFAULT_VER ready"
      node --version && npm --version
    verifyScript: |
      command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 && echo ready
    uninstallScript: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
      # Per-version remove from the picker passes JCODE_VERSION; a bare remove tears down nvm entirely.
      if [ -n "${JCODE_VERSION:-}" ]; then
        nvm uninstall "$JCODE_VERSION" || true
      else
        rm -rf "$NVM_DIR"
      fi
      # Re-point the default + PATH symlinks at the newest remaining version, or remove them if none left.
      if [ -s "$NVM_DIR/nvm.sh" ] && [ -n "$(ls -1 "$NVM_DIR/versions/node" 2>/dev/null)" ]; then
        . "$NVM_DIR/nvm.sh"
        DEFAULT_VER="$(nvm version node)"
        nvm alias default "$DEFAULT_VER"
        DEFAULT_DIR="$NVM_DIR/versions/node/$DEFAULT_VER"
        for b in node npm npx corepack; do
          if [ -x "$DEFAULT_DIR/bin/$b" ]; then sudo ln -sf "$DEFAULT_DIR/bin/$b" "/usr/local/bin/$b"; else sudo rm -f "/usr/local/bin/$b"; fi
        done
      else
        sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack
      fi
    updateCheckScript: ""
    # Newest release of each major line, newest first (first entry = "latest"), emitted as
    # "version<TAB>tag". A line is badged "LTS <codename>" only while it is a *currently-supported* LTS
    # (its major has an `lts` date in the official release schedule and today is on/before its `end` date),
    # so EOL former-LTS lines (e.g. v18 Hydrogen) are not mislabelled as supported. curl failures propagate
    # (captured, not masked by `| head`); a failed schedule fetch degrades gracefully to no badges.
    versionsScript: |
      command -v curl >/dev/null 2>&1 || { echo "curl not found" >&2; exit 1; }
      TODAY=$(date -u +%Y-%m-%d)
      SCHEDFILE=$(mktemp)
      curl -fsSL https://raw.githubusercontent.com/nodejs/Release/main/schedule.json -o "$SCHEDFILE" 2>/dev/null || true
      INDEX=$(curl -fsSL https://nodejs.org/dist/index.tab) || { rm -f "$SCHEDFILE"; exit 1; }
      [ -n "$INDEX" ] || { rm -f "$SCHEDFILE"; exit 1; }
      printf '%s\n' "$INDEX" | awk -F'\t' -v today="$TODAY" -v schedfile="$SCHEDFILE" '
        FILENAME==schedfile {
          if ($0 ~ /^[ \t]*"v[0-9]/)   { cur=$0; sub(/^[ \t]*"/,"",cur); sub(/".*/,"",cur) }
          else if ($0 ~ /"lts":/)      { v=$0; sub(/.*"lts":[ \t]*"/,"",v); sub(/".*/,"",v); ltsstart[cur]=v }
          else if ($0 ~ /"end":/)      { v=$0; sub(/.*"end":[ \t]*"/,"",v); sub(/".*/,"",v); endd[cur]=v }
          else if ($0 ~ /"codename":/) { v=$0; sub(/.*"codename":[ \t]*"/,"",v); sub(/".*/,"",v); code[cur]=v }
          next
        }
        FNR>1 {
          ver=$1; major=ver; sub(/\..*/,"",major)
          if (!seen[major]++) {
            tag=""
            if ((major in ltsstart) && code[major]!="" && (major in endd) && today <= endd[major]) tag="LTS " code[major]
            printf "%s\t%s\n", ver, tag
          }
        }
      ' "$SCHEDFILE" - | head -24
      rm -f "$SCHEDFILE"
    installedVersionsScript: |
      ls -1 "$HOME/.nvm/versions/node" 2>/dev/null | sort -rV

  - id: jdk
    category: languages
    name: Java (JDK)
    description: OpenJDK plus ktlint — the JVM runtime and formatter that Kotlin/Java language servers, Gradle and the Kotlin formatter need. Several JDKs can be installed side by side; the newest is the default on PATH.
    multiVersion: true
    # Ubuntu ships every supported OpenJDK line as its own package, and they install into separate
    # /usr/lib/jvm directories, so they already coexist. What was missing was a *chosen* default:
    # update-alternatives points java/javac at one of them, and a profile drop-in exports the matching
    # JAVA_HOME (Gradle and jdtls read JAVA_HOME, not PATH).
    installScript: |
      set -e
      V="${JCODE_VERSION:-}"
      jcode_progress 5 "Resolving the JDK to install"
      if [ -z "$V" ] || [ "$V" = "latest" ]; then
        sudo apt-get update
        V=$(apt-cache search --names-only '^openjdk-[0-9]+-jdk-headless$' 2>/dev/null |
          sed -n 's/^openjdk-\([0-9][0-9]*\)-jdk-headless .*/\1/p' | sort -n | tail -1)
      else
        sudo apt-get update
      fi
      [ -n "$V" ] || { echo "Could not work out which OpenJDK versions this distro offers."; exit 1; }
      jcode_progress 20 "Installing OpenJDK $V"
      sudo apt-get install -y "openjdk-$V-jdk-headless" curl ca-certificates
      JH=$(ls -d /usr/lib/jvm/java-"$V"-openjdk-* 2>/dev/null | head -1)
      [ -n "$JH" ] || { echo "OpenJDK $V installed but its /usr/lib/jvm directory is missing."; exit 1; }
      jcode_progress 70 "Making OpenJDK $V the default"
      # Newest installed wins the default, matching the Node.js entry's rule.
      NEWEST=$(ls -1 /usr/lib/jvm 2>/dev/null | sed -n 's/^java-\([0-9][0-9]*\)-openjdk.*/\1/p' | sort -n | tail -1)
      NEWEST_HOME=$(ls -d /usr/lib/jvm/java-"$NEWEST"-openjdk-* 2>/dev/null | head -1)
      for b in java javac jar javadoc jarsigner keytool; do
        if [ -x "$NEWEST_HOME/bin/$b" ]; then
          sudo update-alternatives --install "/usr/bin/$b" "$b" "$NEWEST_HOME/bin/$b" 2000 >/dev/null 2>&1 || true
          sudo update-alternatives --set "$b" "$NEWEST_HOME/bin/$b" >/dev/null 2>&1 || true
        fi
      done
      printf 'export JAVA_HOME=%s\n' "$NEWEST_HOME" | sudo tee /etc/profile.d/jcode-java.sh >/dev/null
      if ! command -v ktlint >/dev/null 2>&1; then
        jcode_progress 85 "Installing ktlint"
        jcode_fetch https://github.com/pinterest/ktlint/releases/latest/download/ktlint /tmp/ktlint 85 97 "Installing ktlint"
        sudo install -m 0755 /tmp/ktlint /usr/local/bin/ktlint
        rm -f /tmp/ktlint
      fi
      jcode_progress 100 "Java $NEWEST ready"
      java -version 2>&1 | head -1
    verifyScript: |
      command -v java >/dev/null 2>&1 && command -v javac >/dev/null 2>&1 && command -v ktlint >/dev/null 2>&1 && echo ready
    uninstallScript: |
      V="${JCODE_VERSION:-}"
      if [ -n "$V" ] && [ "$V" != "latest" ]; then
        sudo apt-get remove -y "openjdk-$V-jdk-headless" || true
      else
        for P in $(dpkg-query -W -f='${Package}\n' 'openjdk-*-jdk-headless' 2>/dev/null); do
          sudo apt-get remove -y "$P" || true
        done
        sudo rm -f /usr/local/bin/ktlint
      fi
      sudo apt-get autoremove -y || true
      # Re-point the default (and JAVA_HOME) at the newest JDK still installed, or clear it.
      NEWEST=$(ls -1 /usr/lib/jvm 2>/dev/null | sed -n 's/^java-\([0-9][0-9]*\)-openjdk.*/\1/p' | sort -n | tail -1)
      if [ -n "$NEWEST" ]; then
        NEWEST_HOME=$(ls -d /usr/lib/jvm/java-"$NEWEST"-openjdk-* 2>/dev/null | head -1)
        for b in java javac jar javadoc jarsigner keytool; do
          [ -x "$NEWEST_HOME/bin/$b" ] && sudo update-alternatives --set "$b" "$NEWEST_HOME/bin/$b" >/dev/null 2>&1 || true
        done
        printf 'export JAVA_HOME=%s\n' "$NEWEST_HOME" | sudo tee /etc/profile.d/jcode-java.sh >/dev/null
      else
        sudo rm -f /etc/profile.d/jcode-java.sh
      fi
    updateCheckScript: ""
    # Every OpenJDK line this distro packages, newest first, badged with the Java LTS releases.
    versionsScript: |
      apt-cache search --names-only '^openjdk-[0-9]+-jdk-headless$' 2>/dev/null |
        sed -n 's/^openjdk-\([0-9][0-9]*\)-jdk-headless .*/\1/p' | sort -rn |
        while read -r v; do
          case "$v" in
            8|11|17|21|25) printf '%s\tLTS\n' "$v" ;;
            *) printf '%s\t\n' "$v" ;;
          esac
        done
    installedVersionsScript: |
      ls -1 /usr/lib/jvm 2>/dev/null | sed -n 's/^java-\([0-9][0-9]*\)-openjdk.*/\1/p' | sort -rn | uniq

  - id: go
    category: languages
    name: Go
    description: The official Go toolchain from go.dev. Several versions can be installed side by side (each in its own /usr/local/go-<version>); the newest is the default on PATH.
    multiVersion: true
    # Each release unpacks into its own /usr/local/go-<version>; /usr/local/go is a symlink to the
    # default one, and the PATH entries point through that symlink — so switching the default is a
    # symlink swap rather than a re-download.
    installScript: |
      set -e
      command -v curl >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y curl ca-certificates; }
      case "$(uname -m)" in
        aarch64|arm64) GO_ARCH=arm64 ;;
        x86_64|amd64)  GO_ARCH=amd64 ;;
        *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
      esac
      jcode_progress 4 "Resolving the Go release"
      V="${JCODE_VERSION:-}"
      if [ -z "$V" ] || [ "$V" = "latest" ]; then
        V=$(curl -fsSL --retry 3 "https://go.dev/VERSION?m=text" | head -1 | sed 's/^go//')
      fi
      [ -n "$V" ] || { echo "Could not reach go.dev to find the current Go release."; exit 1; }
      TARGET="/usr/local/go-$V"
      if [ ! -x "$TARGET/bin/go" ]; then
        jcode_fetch "https://go.dev/dl/go$V.linux-$GO_ARCH.tar.gz" "/tmp/go-$V.tar.gz" 5 80 "Downloading Go $V"
        jcode_progress 82 "Unpacking Go $V"
        sudo rm -rf "$TARGET" /tmp/go
        sudo tar -xzf "/tmp/go-$V.tar.gz" -C /tmp
        sudo mv /tmp/go "$TARGET"
        rm -f "/tmp/go-$V.tar.gz"
      fi
      jcode_progress 92 "Making Go the default on PATH"
      # /usr/local/go was a real directory in installs made before versions coexisted; replace it.
      [ -L /usr/local/go ] || sudo rm -rf /usr/local/go
      NEWEST=$(ls -1d /usr/local/go-* 2>/dev/null | sed 's#.*/go-##' | sort -rV | head -1)
      sudo ln -sfn "/usr/local/go-$NEWEST" /usr/local/go
      sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
      sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      jcode_progress 100 "Go $NEWEST ready"
      go version
    verifyScript: |
      command -v go >/dev/null 2>&1 && go version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      V="${JCODE_VERSION:-}"
      if [ -n "$V" ] && [ "$V" != "latest" ]; then
        sudo rm -rf "/usr/local/go-$V"
      else
        sudo rm -rf /usr/local/go-* /usr/local/go "$HOME/go"
      fi
      NEWEST=$(ls -1d /usr/local/go-* 2>/dev/null | sed 's#.*/go-##' | sort -rV | head -1)
      if [ -n "$NEWEST" ]; then
        sudo ln -sfn "/usr/local/go-$NEWEST" /usr/local/go
      else
        sudo rm -rf /usr/local/go
        sudo rm -f /usr/local/bin/go /usr/local/bin/gofmt
      fi
    updateCheckScript: |
      L=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -1 | sed 's/^go//')
      [ -n "$L" ] && [ ! -x "/usr/local/go-$L/bin/go" ]
    # Newest patch of each Go minor line, newest first, from the module proxy's toolchain list — a
    # plain text file. (go.dev/dl?mode=json&include=all lists the same releases but is several MB of
    # pretty-printed JSON with one file entry per platform, which is a slow download to parse on a
    # phone.) Go supports the two most recent minor lines, so those get the badge; -rc builds are
    # dropped by requiring a numeric version.
    versionsScript: |
      case "$(uname -m)" in
        x86_64|amd64) GA=amd64 ;;
        *) GA=arm64 ;;
      esac
      curl -fsSL --retry 3 "https://proxy.golang.org/golang.org/toolchain/@v/list" |
        sed -n "s/^v0\.0\.1-go\([0-9][0-9.]*\)\.linux-$GA\$/\1/p" |
        sort -rV |
        awk -F. '{ line = $1 "." $2; if (!seen[line]++) { n++; printf "%s\t%s\n", $0, (n <= 2 ? "Supported" : "") } }' |
        head -12
    installedVersionsScript: |
      ls -1d /usr/local/go-* 2>/dev/null | sed 's#.*/go-##' | sort -rV

  - id: rust
    category: build-tools
    name: Rust toolchain
    description: rustc and cargo managed with rustup — several toolchains can be installed side by side and the newest is the default. Installs into the runtime user's home.
    multiVersion: true
    # rustup already keeps toolchains side by side; what was missing is PATH. JCode's terminals and
    # Build & Run use `sh -c` without sourcing a profile, so ~/.cargo/env is never read and cargo was
    # invisible to everything but an interactive login shell. The shims are symlinked into
    # /usr/local/bin the same way the Node.js entry does it.
    installScript: |
      set -e
      export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
      jcode_progress 5 "Installing build prerequisites"
      sudo apt-get update
      sudo apt-get install -y curl ca-certificates build-essential
      V="${JCODE_VERSION:-}"
      [ -z "$V" ] && V=stable
      [ "$V" = "latest" ] && V=stable
      if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
        jcode_progress 25 "Installing rustup"
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
        # --no-modify-path: the /usr/local/bin symlinks below are what puts Rust on PATH here, and a
        # .profile edit would only ever apply to interactive login shells.
        sh /tmp/rustup-init.sh -y --no-modify-path --default-toolchain "$V"
        rm -f /tmp/rustup-init.sh
      else
        jcode_progress 30 "Installing Rust $V"
        "$CARGO_HOME/bin/rustup" toolchain install "$V"
      fi
      jcode_progress 85 "Selecting the default toolchain"
      "$CARGO_HOME/bin/rustup" default "$V" >/dev/null 2>&1 || true
      jcode_progress 92 "Putting cargo on PATH"
      for b in rustc cargo rustup rustfmt clippy-driver cargo-clippy rust-analyzer; do
        if [ -x "$CARGO_HOME/bin/$b" ]; then sudo ln -sf "$CARGO_HOME/bin/$b" "/usr/local/bin/$b"; fi
      done
      # Reached through the symlinks above, the shims need to know where the toolchains live.
      printf 'export CARGO_HOME=%s\nexport RUSTUP_HOME=%s\nexport PATH="$PATH:%s/bin"\n' \
        "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_HOME" | sudo tee /etc/profile.d/jcode-rust.sh >/dev/null
      jcode_progress 100 "Rust ready"
      "$CARGO_HOME/bin/rustc" --version
    verifyScript: |
      command -v rustc >/dev/null 2>&1 && command -v cargo >/dev/null 2>&1 && echo ready
    uninstallScript: |
      export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
      V="${JCODE_VERSION:-}"
      if [ -n "$V" ] && [ "$V" != "latest" ] && [ -x "$CARGO_HOME/bin/rustup" ]; then
        "$CARGO_HOME/bin/rustup" toolchain uninstall "$V" || true
        # Removing the default leaves rustup with none; promote whatever is left.
        NEXT=$("$CARGO_HOME/bin/rustup" toolchain list 2>/dev/null | sed 's/ (default)//; s/ (override)//' | head -1)
        [ -n "$NEXT" ] && [ "$NEXT" != "no installed toolchains" ] &&
          "$CARGO_HOME/bin/rustup" default "$NEXT" >/dev/null 2>&1 || true
      else
        rm -rf "$CARGO_HOME" "$RUSTUP_HOME"
        sudo rm -f /etc/profile.d/jcode-rust.sh
      fi
      if [ ! -x "$CARGO_HOME/bin/rustc" ]; then
        for b in rustc cargo rustup rustfmt clippy-driver cargo-clippy rust-analyzer; do
          sudo rm -f "/usr/local/bin/$b"
        done
      fi
    updateCheckScript: ""
    # rustup's channels first (what most projects actually pin to), then the recent numbered releases
    # read from the release notes in the Rust repo — plain raw.githubusercontent, so no API rate limit.
    versionsScript: |
      printf 'stable\tChannel\nbeta\tChannel\nnightly\tChannel\n'
      curl -fsSL --retry 3 https://raw.githubusercontent.com/rust-lang/rust/master/RELEASES.md 2>/dev/null |
        sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -15 |
        while read -r v; do printf '%s\t\n' "$v"; done
    installedVersionsScript: |
      "$HOME/.cargo/bin/rustup" toolchain list 2>/dev/null |
        grep -v 'no installed toolchains' |
        sed 's/ (default)//; s/ (override)//; s/-[a-z0-9_]*-unknown-linux-gnu$//; s/-aarch64.*$//; s/-x86_64.*$//'

  - id: cmake-ninja
    category: build-tools
    name: CMake and Ninja
    description: Installs the baseline native build tools used by JCode and Android/NDK projects.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing CMake and Ninja" cmake ninja-build pkg-config
    verifyScript: |
      command -v cmake >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y cmake ninja-build pkg-config
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(cmake|ninja-build|pkg-config)/'"

  - id: android-prereqs
    category: android
    name: Android SDK prerequisites
    description: JDK 21 plus the distro's native aarch64 Android build tools (aapt2/aapt/zipalign/apksigner) — the ARM-native pieces Google's x86_64-only build-tools can't provide on this device.
    supportedArches: [arm64]
    installScript: |
      set -e
      jcode_apt 0 100 "Installing the Android build prerequisites" \
        openjdk-21-jdk-headless unzip wget zip file procps curl ca-certificates aapt android-sdk-build-tools
    verifyScript: |
      command -v javac >/dev/null 2>&1 && /usr/lib/android-sdk/build-tools/debian/aapt2 version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y openjdk-21-jdk-headless aapt android-sdk-build-tools
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(openjdk-21-jdk-headless|aapt|android-sdk-build-tools)/'"

  - id: android-sdk
    category: android
    name: Android SDK
    description: Command-line tools, Android platforms, build-tools and the latest Gradle, wired with the ARM-native aapt2 so on-device Gradle builds (assembleDebug) produce a real APK. Several platforms can be installed side by side and a project picks any of them with compileSdk; the newest one this device's aapt2 can actually read is the default and is recorded in android-sdk/jcode-compile-sdk.txt. That is NOT the newest platform that exists — the version list marks the ones this device cannot build against. Gradle is exposed at /opt/gradle/current and on PATH. Requires the Android SDK prerequisites. Large download.
    supportedArches: [arm64]
    requiredSdks: [android-prereqs]
    # The SDK keeps every platform in its own platforms/android-<api> directory, so they coexist with
    # no extra machinery — only the shared base (command-line tools, build-tools, Gradle) is single.
    multiVersion: true
    # Several hundred MB over a phone connection. The global "Toolchain install timeout" setting still
    # wins when it is larger; this only stops a short default from killing a healthy install midway.
    minInstallTimeoutMinutes: 45
    installScript: |
      set -e
      export ANDROID_HOME="$HOME/android-sdk"
      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
      DEB=/usr/lib/android-sdk/build-tools/debian
      SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      mkdir -p "$ANDROID_HOME"

      # NEVER pipe `yes` into sdkmanager. Under proot a writer gets no SIGPIPE when its reader exits,
      # so `yes | sdkmanager` leaves `yes` spinning on a dead pipe and the pipeline never returns —
      # that one detail is what used to turn this install into a 90-minute hang, which the outer
      # timeout then killed halfway through. With stdin on /dev/null sdkmanager exits on its own
      # (measured on an Odin2: 2s for a no-op, 53s for a real build-tools download), so none of the
      # old background/poll/pkill machinery is needed.
      #
      # Runs sdkmanager and reports real download progress over [$1,$2].
      #
      # sdkmanager prints its "[====  ] 48%" meter only to a terminal — piped (as it must be here) it
      # emits nothing to parse, and --verbose adds no percentages either. What it does do is stage
      # every download under $ANDROID_HOME/.temp, so the bytes on disk there measured against the
      # archive size the manifest declares ($4) are the progress. Reported monotonically: .temp
      # shrinks again when the archive is unpacked, and a bar that ran backwards would read as a
      # stall. Progress simply stays put if the size is unknown.
      sdkm_run() {
        _a=$1; _b=$2; _l=$3; _exp=$4; shift 4
        "$SDKM" --sdk_root="$ANDROID_HOME" "$@" < /dev/null > /tmp/jcode-sdkm.log 2>&1 &
        _pid=$!
        _max=$_a
        while kill -0 "$_pid" 2>/dev/null; do
          if [ "${_exp:-0}" -gt 0 ]; then
            _k=$(du -sk "$ANDROID_HOME/.temp" 2>/dev/null | awk '{print $1}')
            if [ -n "$_k" ]; then
              _p=$(( _a + (_b - _a) * (_k * 1024) / _exp ))
              [ "$_p" -gt "$_b" ] && _p=$_b
              [ "$_p" -gt "$_max" ] && _max=$_p
              jcode_progress "$_max" "$_l"
            fi
          fi
          sleep 2
        done
        # Deliberately not the caller's verdict — sdkmanager exits 0 even when it installed nothing
        # (e.g. it skipped every package because a licence was unaccepted), so every caller checks
        # for the artifact it wanted and prints the log itself when that is missing.
        wait "$_pid" || true
        jcode_progress "$_b" "$_l"
        return 0
      }

      # Download size the manifest declares for a package path, in bytes (0 when not found). Each
      # <remotePackage path="…"> block carries its archive's <size> before the next block starts.
      pkg_size() {
        [ -f "$REPO_XML" ] || { echo 0; return 0; }
        awk -v p="path=\"$1\"" '
          index($0, p) { seen = 1 }
          seen && /<size>/ { sub(/.*<size>/, ""); sub(/<\/size>.*/, ""); print; found = 1; exit }
          END { if (!found) print 0 }
        ' "$REPO_XML"
      }

      jcode_progress 2 "Reading Google's package manifest"
      # One manifest fetch drives every version choice below (`sdkmanager --list` re-downloads the
      # same manifest through a JVM and takes minutes under proot). 2-3 is current; 2-1 is kept as a
      # fallback so a manifest-schema bump does not break the install outright.
      REPO_XML=""
      for R in repository2-3.xml repository2-1.xml; do
        if wget -q --timeout=60 --tries=3 -O /tmp/android-repo.xml "https://dl.google.com/android/repository/$R"; then
          REPO_XML=/tmp/android-repo.xml
          # Kept so the version picker still has a list when the network is down (see versionsScript).
          mkdir -p "$HOME/.cache/jcode" 2>/dev/null || true
          cp -f /tmp/android-repo.xml "$HOME/.cache/jcode/android-repo.xml" 2>/dev/null || true
          break
        fi
      done
      if [ -z "$REPO_XML" ]; then
        echo "Could not reach dl.google.com to read the Android package manifest. Check the connection and retry."
        exit 1
      fi

      # Newest RELEASED build-tools. Match the FULL quoted package path (path="…") so a numeric
      # prefix of a preview or extension package is never picked: an unanchored regex truncates
      # e.g. platforms;android-37.2-beta1 to the non-existent "platforms;android-37.2" (sdkmanager
      # then reports "Failed to find package"). Anchoring to the closing quote drops -beta1 previews,
      # -extNN extension SDKs, and -rcN build-tools in one step.
      BUILD_TOOLS=$(grep -oE 'path="build-tools;[0-9]+\.[0-9]+\.[0-9]+"' "$REPO_XML" | sed -E 's/^path="//; s/"$//' | sort -u -V | tail -1)
      ALL_PLATFORMS=$(grep -oE 'path="platforms;android-[0-9]+(\.[0-9]+)?"' "$REPO_XML" | sed -E 's/^path="//; s/"$//' | sort -u -Vr)
      CLT_ZIP=$(grep -oE 'commandlinetools-linux-[0-9]+_latest\.zip' "$REPO_XML" | sort -u -V | tail -1)
      if [ -z "$BUILD_TOOLS" ] || [ -z "$ALL_PLATFORMS" ] || [ -z "$CLT_ZIP" ]; then
        echo "Google's package manifest did not list the packages JCode needs (build-tools / platforms / command-line tools)."
        exit 1
      fi
      BT_VER="${BUILD_TOOLS#build-tools;}"

      if [ ! -x "$SDKM" ]; then
        jcode_progress 4 "Downloading Android command-line tools"
        jcode_fetch "https://dl.google.com/android/repository/$CLT_ZIP" /tmp/clt.zip 4 14 "Downloading Android command-line tools"
        rm -rf /tmp/cmdline-tools && (cd /tmp && unzip -q clt.zip)
        mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
        mv /tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
        rm -rf /tmp/cmdline-tools /tmp/clt.zip
      fi
      [ -x "$SDKM" ] || { echo "The Android command-line tools did not unpack correctly."; exit 1; }

      jcode_progress 15 "Accepting SDK licenses"
      # Neither `yes |` nor /dev/null works here. `yes` never dies (see above), but a plain
      # </dev/null is worse than useless: on a fresh SDK root --licenses PROMPTS for each licence and
      # reads EOF as "No", then silently skips every package — the install then fails several minutes
      # later with "could not install build-tools" and no hint why. A FINITE stream of confirmations
      # satisfies both: it answers every prompt and then ends on its own.
      printf 'y\n%.0s' $(seq 40) | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
      if [ -z "$(ls -A "$ANDROID_HOME/licenses" 2>/dev/null)" ]; then
        echo "Could not accept the Android SDK licences — sdkmanager wrote none to $ANDROID_HOME/licenses."
        exit 1
      fi

      if [ ! -x "$ANDROID_HOME/build-tools/$BT_VER/aapt2" ]; then
        BT_BYTES=$(( $(pkg_size "$BUILD_TOOLS") + $(pkg_size "platform-tools") ))
        sdkm_run 18 45 "Installing $BUILD_TOOLS and platform-tools" "$BT_BYTES" "$BUILD_TOOLS" "platform-tools"
      fi
      if [ ! -x "$ANDROID_HOME/build-tools/$BT_VER/aapt2" ]; then
        # sdkmanager exits 0 even when it silently skipped everything, so the log is the only place
        # the actual reason appears. Print it rather than a guess.
        echo "sdkmanager could not install $BUILD_TOOLS:"
        tail -n 12 /tmp/jcode-sdkm.log 2>/dev/null || true
        exit 1
      fi

      jcode_progress 46 "Swapping in this device's native ARM binaries"
      # Replace the x86_64 build-tools executables with the distro's native aarch64 builds — in EVERY
      # build-tools directory present, not just the newest: a project that pins buildToolsVersion
      # picks its own, and an unswapped one fails with a bare "not found" (a wrong-arch ELF).
      #
      # Swap EVERY executable the Debian package provides, not the three we first hit. aidl was the
      # one that got away: it is not on the path of a simple app, so nothing noticed until a project
      # with an .aidl file reached :compileDebugAidl and died on "A problem occurred starting process
      # 'command .../build-tools/35.0.0/aidl'" — a message that names no architecture and reads like a
      # missing file. Everything else here is a jar, a script or data, which run anywhere.
      for BTDIR in "$ANDROID_HOME"/build-tools/*/; do
        [ -d "$BTDIR" ] || continue
        for b in aapt2 aapt zipalign aidl aidl-cpp split-select; do
          if [ -e "$DEB/$b" ]; then cp -f "$DEB/$b" "$BTDIR$b"; fi
        done
      done
      # Same treatment for adb, which platform-tools also ships x86_64-only. AGP invokes it by
      # ABSOLUTE path ($ANDROID_HOME/platform-tools/adb) rather than through PATH, so a native adb
      # earlier in PATH does not save it: installDebug dies with "Exec format error" without this.
      if [ -x /usr/bin/adb ] && [ -d "$ANDROID_HOME/platform-tools" ]; then
        cp -f /usr/bin/adb "$ANDROID_HOME/platform-tools/adb"
      fi
      # AGP 8+ resolves its OWN aapt2 as a Maven artifact (aapt2-<ver>-linux), which is x86_64 only,
      # so replacing the copy in build-tools above is not enough — the Maven one wins and the build
      # dies with "AAPT2 ... Daemon startup failed". Point AGP at the native binary instead. Written
      # to both Gradle homes because the SDK installs as the runtime user while run terminals build
      # as root, and Gradle reads gradle.properties from whichever home is in effect.
      for GH in "$HOME/.gradle" /root/.gradle; do
        mkdir -p "$GH" 2>/dev/null || sudo mkdir -p "$GH"
        LINE="android.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/$BT_VER/aapt2"
        if [ -f "$GH/gradle.properties" ]; then
          grep -v '^android.aapt2FromMavenOverride=' "$GH/gradle.properties" > "$GH/gradle.properties.tmp" 2>/dev/null || true
          mv "$GH/gradle.properties.tmp" "$GH/gradle.properties" 2>/dev/null || true
        fi
        echo "$LINE" >> "$GH/gradle.properties" 2>/dev/null || sudo sh -c "echo '$LINE' >> '$GH/gradle.properties'"
      done

      # Pick the newest platform this device's aapt2 can actually LINK against. `link` is the probe
      # because it is exactly what the build performs (LinkApplicationAndroidResources) and it fails
      # in milliseconds; `aapt2 dump resources` was measured spinning for 13 minutes on a jar it half
      # understands, which is indistinguishable from a hung install.
      NATIVE_AAPT2="$ANDROID_HOME/build-tools/$BT_VER/aapt2"
      printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="jcode.probe">' '  <application />' '</manifest>' > /tmp/jcode-probe-manifest.xml
      probe_platform() {
        [ -f "$ANDROID_HOME/platforms/$1/android.jar" ] || return 1
        timeout 120 "$NATIVE_AAPT2" link -I "$ANDROID_HOME/platforms/$1/android.jar" \
          --manifest /tmp/jcode-probe-manifest.xml -o /tmp/jcode-probe.apk >/dev/null 2>&1
      }

      # Which platform to even TRY first. Downloading newest-first costs ~90 MB per rejected
      # candidate, and the newest is essentially never the answer here: Google ships no arm64 aapt2,
      # so we run Debian's, frozen at 2.19, and it cannot parse the resource tables that platforms
      # newer than 34 carry (measured on an Odin2: 34 links; 35/36/37 fail with "RES_TABLE_TYPE_TYPE
      # entry offsets overlap actual entry data"). Start at the known ceiling for the aapt2 actually
      # present and only ever walk DOWN from there. An aapt2 this table doesn't know about — a newer
      # Debian build — is given the benefit of the doubt and starts from the newest platform.
      AAPT2_VER=$("$NATIVE_AAPT2" version 2>&1 | sed -n 's/.*(aapt) \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
      case "$AAPT2_VER" in
        2.19) CEILING=34 ;;
        *) CEILING=9999 ;;
      esac
      echo "aapt2 $AAPT2_VER — trying Android platforms from API $CEILING downwards"

      jcode_progress 50 "Choosing an Android platform"
      WANT="${JCODE_VERSION:-}"
      [ "$WANT" = "latest" ] && WANT=""
      CHOSEN=""
      if [ -n "$WANT" ]; then
        # A platform was picked in the version list. Install exactly that one — platforms coexist, so
        # this ADDS to whatever is already there rather than replacing it.
        CDIR="android-$WANT"
        # Refuse before downloading. The list marks these "Unsupported here", but the newest is also
        # the list head (what the picker preselects), so it is easy to pick one by accident — and
        # finding out after ~90 MB has been pulled is the sort of failure this entry is meant to stop.
        WANT_API=$(printf '%s' "$WANT" | sed -E 's/\..*$//')
        case "$WANT_API" in ''|*[!0-9]*) WANT_API=0 ;; esac
        if [ "$WANT_API" -gt "$CEILING" ]; then
          rm -f /tmp/jcode-probe.apk /tmp/jcode-probe-manifest.xml /tmp/jcode-sdkm.log "$REPO_XML"
          echo "Android platform $WANT cannot be used on this device."
          echo "aapt2 $AAPT2_VER — the only ARM build available — cannot read the resource tables that"
          echo "API $((CEILING + 1)) and newer ship, so nothing would ever build against it. Nothing was downloaded."
          echo "Install API $CEILING or lower; the version list marks those as supported."
          exit 1
        fi
        if [ ! -f "$ANDROID_HOME/platforms/$CDIR/android.jar" ]; then
          echo "== Android platform $CDIR: downloading =="
          sdkm_run 50 78 "Downloading Android platform $CDIR" "$(pkg_size "platforms;$CDIR")" "platforms;$CDIR"
        fi
        if probe_platform "$CDIR"; then
          CHOSEN="$CDIR"
          echo "   aapt2 links against $CDIR"
        else
          # Keep the SDK exactly as it was: only this candidate is removed, so any platform that was
          # already working still is.
          rm -rf "$ANDROID_HOME/platforms/$CDIR"
          rm -f /tmp/jcode-probe.apk /tmp/jcode-probe-manifest.xml /tmp/jcode-sdkm.log "$REPO_XML"
          echo "Android platform $CDIR downloaded, but this device's aapt2 ($AAPT2_VER) cannot read its"
          echo "resource table — nothing could ever build against it, so it has been removed again."
          echo "Choose a platform the version list does not mark as unsupported (API $CEILING or lower)."
          exit 1
        fi
      else
        # No particular version asked for: land one that works. A platform already on disk is free to
        # test, so a retried install never re-downloads 90 MB, and one left behind by an interrupted
        # run that this aapt2 cannot read is removed here rather than lingering forever.
        for D in $(ls -1 "$ANDROID_HOME/platforms" 2>/dev/null | sort -Vr); do
          if probe_platform "$D"; then
            CHOSEN="$D"
            echo "   reusing the already-installed $D"
            break
          fi
          echo "   removing $D — this device's aapt2 cannot read its resource table"
          rm -rf "$ANDROID_HOME/platforms/$D"
        done

        TRIED=0
        for CAND in $ALL_PLATFORMS; do
          [ -n "$CHOSEN" ] && break
          CDIR="${CAND#platforms;}"
          API=$(printf '%s' "$CDIR" | sed -E 's/^android-//; s/\..*$//')
          case "$API" in ''|*[!0-9]*) continue ;; esac
          # Above the ceiling this aapt2 provably cannot read it; below 30 it is too old to build against.
          [ "$API" -le "$CEILING" ] || continue
          [ "$API" -ge 30 ] || continue
          # Three strikes. Past that the ceiling table is wrong about this device and downloading more
          # candidates is just burning the user's data.
          TRIED=$((TRIED + 1))
          [ "$TRIED" -le 3 ] || break
          echo "== Android platform $CDIR: downloading and probing =="
          sdkm_run 50 78 "Downloading Android platform $CDIR" "$(pkg_size "$CAND")" "$CAND"
          if probe_platform "$CDIR"; then
            CHOSEN="$CDIR"
            echo "   aapt2 links against $CDIR — using it"
            break
          fi
          echo "   aapt2 cannot read $CDIR's resource table — removing it and stepping down"
          rm -rf "$ANDROID_HOME/platforms/$CDIR"
        done
      fi
      if [ -z "$CHOSEN" ]; then
        rm -f /tmp/jcode-probe.apk /tmp/jcode-probe-manifest.xml /tmp/jcode-sdkm.log "$REPO_XML"
        echo "No available Android platform can be read by this device's aapt2 ($AAPT2_VER)."
        echo "Install an older one by hand, e.g.: sdkmanager 'platforms;android-34'"
        exit 1
      fi

      # The default compileSdk is the newest INSTALLED platform this aapt2 can read — not necessarily
      # the one just installed, since an older platform can be added alongside a newer one. Recorded
      # so the Run/Build recipes and the user can see what actually works here; the number is not
      # guessable, and a project written against a newer platform still fails to link.
      DEFAULT_PLATFORM=""
      for D in $(ls -1 "$ANDROID_HOME/platforms" 2>/dev/null | sort -Vr); do
        if probe_platform "$D"; then DEFAULT_PLATFORM="$D"; break; fi
      done
      [ -n "$DEFAULT_PLATFORM" ] || DEFAULT_PLATFORM="$CHOSEN"
      rm -f /tmp/jcode-probe.apk /tmp/jcode-probe-manifest.xml /tmp/jcode-sdkm.log "$REPO_XML"
      COMPILE_SDK=$(printf '%s' "$DEFAULT_PLATFORM" | sed -E 's/^android-//')
      printf '%s\n' "$COMPILE_SDK" > "$ANDROID_HOME/jcode-compile-sdk.txt"

      jcode_progress 80 "Resolving the latest Gradle"
      GRADLE_VERSION=$(wget -qO- --timeout=60 --tries=3 https://services.gradle.org/versions/current | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p')
      if [ -z "$GRADLE_VERSION" ]; then
        echo "Could not reach services.gradle.org to find the current Gradle release."
        exit 1
      fi
      if [ ! -x "/opt/gradle/gradle-$GRADLE_VERSION/bin/gradle" ]; then
        jcode_fetch "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" /tmp/gradle.zip 81 96 "Downloading Gradle $GRADLE_VERSION"
        sudo mkdir -p /opt/gradle && (cd /opt/gradle && sudo unzip -q -o /tmp/gradle.zip) && rm -f /tmp/gradle.zip
      fi
      # Stable paths so run recipes and projects never hardcode a Gradle version.
      jcode_progress 98 "Linking Gradle onto PATH"
      sudo ln -sfn "/opt/gradle/gradle-$GRADLE_VERSION" /opt/gradle/current
      sudo ln -sf /opt/gradle/current/bin/gradle /usr/local/bin/gradle
      jcode_progress 100 "Android SDK ready"
      echo
      echo "================================================================"
      echo " Android SDK ready. Use compileSdk $COMPILE_SDK in your build.gradle."
      echo " Platforms installed: $(ls -1 "$ANDROID_HOME/platforms" 2>/dev/null | sort -Vr | sed 's/^android-//' | tr '\n' ' ')"
      echo " Newer platforms exist, but the only arm64 aapt2 available cannot"
      echo " read their resources, so a higher compileSdk will fail to link."
      echo "================================================================"
    verifyScript: |
      ls "$HOME"/android-sdk/platforms/*/android.jar >/dev/null 2>&1 && [ -x /opt/gradle/current/bin/gradle ] && BT=$(ls -d "$HOME"/android-sdk/build-tools/*/ 2>/dev/null | sort -V | tail -1) && "${BT}aapt2" version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      ANDROID_HOME="$HOME/android-sdk"
      V="${JCODE_VERSION:-}"
      if [ -n "$V" ] && [ "$V" != "latest" ]; then
        # Removing one platform leaves the shared base (command-line tools, build-tools, Gradle) and
        # every other platform alone.
        rm -rf "$ANDROID_HOME/platforms/android-$V"
        # Re-point the recorded default at the newest platform still installed that aapt2 can read.
        BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
        DEFAULT_PLATFORM=""
        if [ -n "$BT" ] && [ -x "${BT}aapt2" ]; then
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="jcode.probe">' '  <application />' '</manifest>' > /tmp/jcode-probe-manifest.xml
          for D in $(ls -1 "$ANDROID_HOME/platforms" 2>/dev/null | sort -Vr); do
            if timeout 120 "${BT}aapt2" link -I "$ANDROID_HOME/platforms/$D/android.jar" \
                 --manifest /tmp/jcode-probe-manifest.xml -o /tmp/jcode-probe.apk >/dev/null 2>&1; then
              DEFAULT_PLATFORM="$D"; break
            fi
          done
          rm -f /tmp/jcode-probe.apk /tmp/jcode-probe-manifest.xml
        fi
        if [ -n "$DEFAULT_PLATFORM" ]; then
          printf '%s\n' "${DEFAULT_PLATFORM#android-}" > "$ANDROID_HOME/jcode-compile-sdk.txt"
          echo "Removed android-$V. compileSdk is now ${DEFAULT_PLATFORM#android-}."
        else
          rm -f "$ANDROID_HOME/jcode-compile-sdk.txt"
          echo "Removed android-$V. No usable Android platform is left — install one to build again."
        fi
      else
        rm -rf "$ANDROID_HOME"
        sudo rm -rf /opt/gradle
        sudo rm -f /usr/local/bin/gradle
      fi
    # Deliberately does NOT compare against the newest platform: what can be installed is capped by
    # what this device's aapt2 can read, so "a newer platform exists" is the normal steady state and
    # would nag forever. Only a newer Gradle is actionable.
    updateCheckScript: |
      [ -d "$HOME/android-sdk/platforms" ] || exit 1
      G=$(wget -qO- https://services.gradle.org/versions/current | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p')
      [ -n "$G" ] && [ ! -x "/opt/gradle/gradle-$G/bin/gradle" ]
    # Every Android platform Google publishes that is worth building against here, newest first, each
    # marked with whether THIS device's aapt2 can actually read it — Google ships no arm64 aapt2, so
    # we run Debian's, and above its ceiling a platform links nowhere (see the install script). They
    # are still offered: the ceiling table is a shortcut, and the install probes for real before
    # keeping anything. Runs without the catalog helpers (the versions fetch is a quiet exec).
    versionsScript: |
      A=/usr/lib/android-sdk/build-tools/debian/aapt2
      CEILING=9999
      if [ -x "$A" ]; then
        case "$("$A" version 2>&1 | sed -n 's/.*(aapt) \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)" in
          2.19) CEILING=34 ;;
        esac
      fi
      # Google's manifest, cached. A version list that vanishes because one HTTPS request blipped is
      # worse than a slightly stale one — platforms are only ever added — so a successful fetch is
      # kept and reused when the next one fails. The install script populates the same cache.
      CACHE="$HOME/.cache/jcode/android-repo.xml"
      mkdir -p "$(dirname "$CACHE")" 2>/dev/null || true
      REPO=""
      for R in repository2-3.xml repository2-1.xml; do
        if wget -q --timeout=60 --tries=3 -O /tmp/jcode-platforms.xml "https://dl.google.com/android/repository/$R"; then
          cp -f /tmp/jcode-platforms.xml "$CACHE" 2>/dev/null || true
          REPO=/tmp/jcode-platforms.xml; break
        fi
      done
      if [ -z "$REPO" ] && [ -s "$CACHE" ]; then REPO="$CACHE"; fi
      [ -n "$REPO" ] || exit 1
      grep -oE 'path="platforms;android-[0-9]+(\.[0-9]+)?"' "$REPO" |
        sed -E 's/^path="platforms;android-//; s/"$//' | sort -u -Vr |
        awk -v ceil="$CEILING" '
          { api = $0; sub(/\..*/, "", api) }
          api + 0 < 30 { next }
          api + 0 > ceil + 0 { print $0 "\tUnsupported here"; next }
          !seen++ { print $0 "\tRecommended"; next }
          { print $0 "\t" }
        '
      rm -f /tmp/jcode-platforms.xml
    installedVersionsScript: |
      ls -1 "$HOME/android-sdk/platforms" 2>/dev/null | sed -n 's/^android-//p' | sort -rV

  - id: adb
    category: android
    name: ADB (Android Debug Bridge)
    description: The distro's native aarch64 adb client. With the JCode ADB bridge paired, adb, ./gradlew installDebug, adb logcat and flutter run inside the runtime all target this phone. Google's platform-tools ship an x86_64-only adb that cannot execute here, so this is the one that actually runs.
    supportedArches: [arm64]
    installScript: |
      set -e
      jcode_apt 0 95 "Installing ADB" adb
      # Fail loudly at install time rather than halfway through the pairing wizard: wireless
      # pairing needs the Android 11+ `adb pair` subcommand, which older builds lack.
      adb help 2>&1 | grep -qE '^[[:space:]]*pair ' || echo "WARNING: this adb has no 'pair' subcommand — wireless pairing will not work."
      # Mirror of the swap in the android-sdk entry, so the two can be installed in either order.
      if [ -d "$HOME/android-sdk/platform-tools" ]; then cp -f /usr/bin/adb "$HOME/android-sdk/platform-tools/adb"; fi
      jcode_progress 100 "ADB ready"
    verifyScript: |
      command -v adb >/dev/null 2>&1 && adb version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y adb
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^adb/'"

  - id: dotnet
    category: dotnet
    name: .NET SDK
    description: The .NET SDK, installed into $HOME/.dotnet. Several channels can be installed side by side — that is how dotnet-install works natively — plus a pinned .NET 8 runtime floor that netcoredbg needs. Installing no particular version gets the current LTS and STS lines.
    multiVersion: true
    installScript: |
      set -e
      jcode_progress 3 "Fetching the .NET installer"
      command -v curl >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y curl ca-certificates; }
      # .NET refuses to start at all without ICU ("Couldn't find a valid ICU package installed on the
      # system", then FailFast) — every `dotnet` invocation aborts, not just globalization-aware code.
      # Ubuntu's package is versioned (libicu78 on 26.04, libicu74 on 24.04), so resolve the newest
      # available rather than pinning a number that breaks on the next release.
      if ! ldconfig -p 2>/dev/null | grep -q libicuuc; then
        jcode_progress 6 "Installing ICU (required by .NET)"
        sudo apt-get update
        ICU=$(apt-cache search --names-only '^libicu[0-9][0-9]*$' | awk '{print $1}' | sort -V | tail -1)
        sudo apt-get install -y "${ICU:-libicu-dev}"
      fi
      mkdir -p "$HOME/.dotnet"
      curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
      V="${JCODE_VERSION:-}"
      [ "$V" = "latest" ] && V=LTS
      if [ -n "$V" ]; then
        jcode_progress 20 "Installing .NET $V"
        # --skip-non-versioned-files unless this really is the newest: the unversioned `dotnet` muxer
        # must stay the newest one installed, or an older host refuses to run a newer SDK's assemblies.
        NEWEST=$(ls -1 "$HOME/.dotnet/sdk" 2>/dev/null | sort -rV | head -1 | cut -d. -f1)
        WANT=$(printf '%s' "$V" | cut -d. -f1)
        case "$WANT" in
          ''|*[!0-9]*) bash /tmp/dotnet-install.sh --channel "$V" --install-dir "$HOME/.dotnet" ;;
          *)
            if [ -z "$NEWEST" ] || [ "$WANT" -ge "$NEWEST" ]; then
              bash /tmp/dotnet-install.sh --channel "$V" --install-dir "$HOME/.dotnet"
            else
              bash /tmp/dotnet-install.sh --channel "$V" --install-dir "$HOME/.dotnet" --skip-non-versioned-files
            fi
            ;;
        esac
      else
        # Currently-supported SDK lines, resolved dynamically so a new .NET release needs no change
        # here. LTS installs first so the newest host owns the unversioned muxer.
        jcode_progress 20 "Installing the .NET LTS SDK"
        bash /tmp/dotnet-install.sh --channel LTS --install-dir "$HOME/.dotnet"
        jcode_progress 55 "Installing the .NET STS SDK"
        bash /tmp/dotnet-install.sh --channel STS --install-dir "$HOME/.dotnet" --skip-non-versioned-files
      fi
      # Pinned .NET 8 runtime floor (runtime-only): netcoredbg is built against .NET 8 and needs
      # the 8.x shared runtime even once .NET 8's SDK is EOL.
      if [ ! -d "$HOME/.dotnet/shared/Microsoft.NETCore.App" ] ||
         ! ls -1 "$HOME/.dotnet/shared/Microsoft.NETCore.App" 2>/dev/null | grep -q '^8\.'; then
        jcode_progress 80 "Installing the .NET 8 runtime floor (for the debugger)"
        bash /tmp/dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir "$HOME/.dotnet" --skip-non-versioned-files
      fi
      rm -f /tmp/dotnet-install.sh
      jcode_progress 92 "Installing the dotnet launcher"
      # CoreCLR over-reserves for the whole device RAM inside proot's ptrace-constrained address
      # space and gets killed on first start; every dotnet call needs the 1 GB GC cap. The shim
      # also puts dotnet + installed global tools on PATH for non-login shells.
      printf '#!/bin/sh\nexport DOTNET_GCHeapHardLimit=0x40000000\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport DOTNET_ROOT="%s/.dotnet"\ncase "$TMPDIR" in /data/*) export TMPDIR=/tmp ;; esac\nexport PATH="$PATH:%s/.dotnet/tools"\nexec "%s/.dotnet/dotnet" "$@"\n' "$HOME" "$HOME" "$HOME" | sudo tee /usr/local/bin/dotnet >/dev/null
      sudo chmod 755 /usr/local/bin/dotnet
      printf 'export DOTNET_GCHeapHardLimit=0x40000000\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport DOTNET_ROOT="%s/.dotnet"\nexport PATH="$PATH:%s/.dotnet/tools"\n' "$HOME" "$HOME" | sudo tee /etc/profile.d/jcode-dotnet.sh >/dev/null
      jcode_progress 100 ".NET ready"
      /usr/local/bin/dotnet --list-sdks 2>/dev/null || true
    verifyScript: |
      [ -x "$HOME/.dotnet/dotnet" ] && /usr/local/bin/dotnet --list-sdks 2>/dev/null | grep -q . && echo ready
    uninstallScript: |
      V="${JCODE_VERSION:-}"
      if [ -n "$V" ] && [ "$V" != "latest" ]; then
        # dotnet has no uninstall command; a channel is its sdk/ and shared/ directories.
        MAJOR=$(printf '%s' "$V" | cut -d. -f1)
        for D in "$HOME/.dotnet/sdk/$MAJOR."*; do [ -e "$D" ] && rm -rf "$D"; done
        for R in "$HOME/.dotnet/shared"/*/"$MAJOR."*; do [ -e "$R" ] && rm -rf "$R"; done
        rm -rf "$HOME/.dotnet/host/fxr/$MAJOR."* 2>/dev/null || true
      else
        rm -rf "$HOME/.dotnet"
        sudo rm -f /usr/local/bin/dotnet /etc/profile.d/jcode-dotnet.sh
      fi
    # Every .NET channel Microsoft still supports, newest first, badged LTS/STS (or Preview). Read
    # from the official releases index, so a new .NET release needs no JCode update. The index is
    # pretty-printed, so the three fields are collected across lines rather than matched on one.
    versionsScript: |
      curl -fsSL --retry 3 https://raw.githubusercontent.com/dotnet/core/main/release-notes/releases-index.json |
        awk -F'"' '
          /"channel-version"/ { ch = $4 }
          /"support-phase"/   { sp = $4 }
          /"release-type"/ {
            if (ch != "" && sp != "eol") printf "%s\t%s\n", ch, (sp == "preview" ? "Preview" : toupper($4))
            ch = ""
          }
        ' | sort -rV | head -8
    installedVersionsScript: |
      ls -1 "$HOME/.dotnet/sdk" 2>/dev/null |
        sed -n 's/^\([0-9][0-9]*\.[0-9][0-9]*\)\..*/\1/p' | sort -rV | uniq

  - id: arm-none-eabi
    category: embedded
    name: ARM embedded GCC
    description: Installs an embedded ARM cross-compiler, GDB multiarch, and OpenOCD.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing the ARM embedded toolchain" gcc-arm-none-eabi gdb-multiarch openocd
    verifyScript: |
      command -v arm-none-eabi-gcc >/dev/null 2>&1 && command -v openocd >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y gcc-arm-none-eabi gdb-multiarch openocd
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(gcc-arm-none-eabi|gdb-multiarch|openocd)/'"

  - id: postgresql
    category: databases
    name: PostgreSQL Client
    description: psql and the PostgreSQL client tools for connecting to a remote, VM, or container server. (The PostgreSQL server itself cannot run under the proot runtime, so no local server is installed.)
    installScript: |
      set -e
      jcode_apt 0 100 "Installing the PostgreSQL client" postgresql-client
    verifyScript: |
      command -v psql >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y postgresql-client
      sudo apt-get autoremove -y
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^postgresql-client'"

  - id: mariadb
    category: databases
    name: MariaDB
    description: MySQL-compatible relational database. Lightweight and ARM64-native.
    installScript: |
      set -e
      jcode_apt 0 90 "Installing MariaDB" mariadb-server mariadb-client
      # Best-effort, both of them: there is no init system under proot, so the daemon often will not
      # come up during an install exec (which runs in its own proot with --kill-on-exit). A failure
      # here is not an install failure — the packages are what this entry delivers, and the server is
      # started from a terminal. Without the guards `set -e` would fail an otherwise fine install.
      jcode_progress 94 "Starting MariaDB to create the jcode user"
      if sudo service mariadb start >/dev/null 2>&1; then
        mysql -u root -e "CREATE USER IF NOT EXISTS '${USER:-jcode}'@'localhost'; GRANT ALL PRIVILEGES ON *.* TO '${USER:-jcode}'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES;" >/dev/null 2>&1 ||
          echo "MariaDB is installed; grant your user privileges once you start it (sudo service mariadb start)."
      else
        echo "MariaDB is installed. Start it from a terminal with: sudo service mariadb start"
      fi
      jcode_progress 100 "MariaDB ready"
    # Presence check, not liveness: the daemon dies with each proot session (--kill-on-exit, no
    # systemd), so a `mysql -u jcode` probe flips an intact install back to "not installed" after
    # every app restart. Start the server from a terminal (`sudo service mariadb start`) to use it.
    verifyScript: |
      command -v mariadbd >/dev/null 2>&1 && command -v mysql >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo service mariadb stop 2>/dev/null || true
      sudo apt-get remove -y mariadb-server mariadb-client
      sudo apt-get autoremove -y
      sudo rm -rf /var/lib/mysql
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(mariadb-|libmariadb)'"

  - id: redis
    category: databases
    name: Redis
    description: In-memory key-value store for caching and real-time data.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing Redis" redis-server
    # Presence check, not liveness: a daemonized redis cannot outlive the install exec (each catalog
    # script runs in its own proot with --kill-on-exit), so pinging one would fail every verify.
    # Start it from a terminal (`redis-server --daemonize yes`) to use it.
    verifyScript: |
      command -v redis-server >/dev/null 2>&1 && redis-cli --version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      redis-cli shutdown 2>/dev/null || true
      sudo apt-get remove -y redis-server
      sudo apt-get autoremove -y
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^redis'"

  - id: sqlcmd
    category: databases
    name: SQL Server client (sqlcmd)
    description: The Microsoft go-sqlcmd command-line client for SQL Server — a single static binary, no server. The SQL Client extension uses it to reach a local, VM, or remote SQL Server.
    supportedArches: [arm64, amd64]
    installScript: |
      set -e
      case "$(uname -m)" in
        aarch64|arm64) A=arm64 ;;
        x86_64|amd64)  A=amd64 ;;
        *) echo "sqlcmd: unsupported arch $(uname -m)"; exit 1 ;;
      esac
      if ! command -v curl >/dev/null 2>&1 || ! command -v bzip2 >/dev/null 2>&1 || ! command -v tar >/dev/null 2>&1; then
        jcode_apt 0 30 "Installing download prerequisites" curl ca-certificates bzip2 tar
      fi
      tmp="$(mktemp -d)"
      jcode_fetch "https://github.com/microsoft/go-sqlcmd/releases/latest/download/sqlcmd-linux-$A.tar.bz2" \
        "$tmp/sqlcmd.tar.bz2" 32 90 "Downloading sqlcmd"
      jcode_progress 92 "Unpacking sqlcmd"
      tar -xjf "$tmp/sqlcmd.tar.bz2" -C "$tmp"
      bin="$(find "$tmp" -type f -name sqlcmd | head -1)"
      [ -n "$bin" ] || { rm -rf "$tmp"; echo "The sqlcmd archive did not contain a sqlcmd binary."; exit 1; }
      sudo install -m 0755 "$bin" /usr/local/bin/sqlcmd
      rm -rf "$tmp"
      jcode_progress 100 "sqlcmd ready"
      sqlcmd --version
    verifyScript: |
      command -v sqlcmd >/dev/null 2>&1 && sqlcmd --version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo rm -f /usr/local/bin/sqlcmd

  - id: git
    category: build-tools
    name: Git
    description: Distributed version control system. Essential for any project workflow.
    installScript: |
      set -e
      jcode_apt 0 100 "Installing Git" git
    verifyScript: |
      command -v git >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y git
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^git/'"

  - id: docker-cli
    category: build-tools
    name: Docker CLI
    description: Docker command-line client for building and managing containers (requires host Docker daemon).
    installScript: |
      set -e
      jcode_apt 0 95 "Installing the Docker CLI" docker.io
      # The runtime user is configurable; hardcoding "jcode" silently skipped the group on any other.
      sudo usermod -aG docker "${USER:-jcode}" 2>/dev/null || true
      jcode_progress 100 "Docker CLI ready"
    verifyScript: |
      command -v docker >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y docker.io
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^docker.io/'"

  - id: qemu-system-x86
    category: virtualization
    name: QEMU (x86)
    description: Full-system QEMU to run x86/x86_64 virtual machines on this ARM device, for software with no ARM build (e.g. Microsoft SQL Server). Pure software emulation (no KVM on device) — VMs are slow but fully compatible. Drives the VM Manager extension.
    supportedArches: [arm64]
    installScript: |
      set -e
      jcode_apt 0 100 "Installing QEMU" qemu-system-x86 qemu-utils
    verifyScript: |
      command -v qemu-system-x86_64 >/dev/null 2>&1 && command -v qemu-img >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo apt-get remove -y qemu-system-x86 qemu-utils
    updateCheckScript: "apt list --upgradable 2>/dev/null | grep -qE '^(qemu-system-x86|qemu-utils)/'"
  - id: opencode
    category: ai
    name: opencode
    description: >-
      The opencode AI coding agent (single self-contained binary, no Node.js needed). Powers the
      OpenChamber extension's right-drawer panel, and briefs the agent on JCode's environment.
      Bring an API key or subscription for your model provider.
    supportedArches: [arm64]
    installScript: |
      set -e
      jcode_apt 0 25 "Installing opencode prerequisites" curl ca-certificates git
      if ! [ -x "$HOME/.opencode/bin/opencode" ]; then
        jcode_progress 35 "Downloading opencode"
        curl -fsSL https://opencode.ai/install | bash
      fi
      [ -x "$HOME/.opencode/bin/opencode" ] || { echo "The opencode installer did not leave a binary in ~/.opencode/bin."; exit 1; }
      jcode_progress 88 "Putting opencode on PATH"
      sudo ln -sf "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode || true
      mkdir -p "$HOME/.config/opencode"
      cat > "$HOME/.config/opencode/AGENTS.md" <<'JCODE_EOF'
      # You are running inside JCode
      You are an AI coding agent inside JCode, a native Android IDE on an ARM64 handheld. Your shell
      runs in a proot Ubuntu 24.04 (aarch64) userland. Hard constraints:
      - Projects live under /workspace (a FUSE mount). It is noexec and has no symlink support: never
        execute compiled binaries from it and never create node_modules there. Use ext4 instead,
        e.g. $HOME/.jcode-run/<project>/.
      - HOME=/root, USER=root, TMPDIR=/tmp. No systemd, no GUI, no Docker, no x86 emulation.
      - .NET: export DOTNET_GCHeapHardLimit=0x40000000 before any dotnet command.
      - The IDE runs projects via .jcode/run.yaml (name, readyPort, terminals: label+command list);
        keep it working when you change how a project runs.
      - Dev servers should bind 127.0.0.1; the IDE opens the device browser against localhost.
      - The screen is small and builds are slow: keep output short, prefer incremental commands.
      JCODE_EOF
      jcode_progress 100 "opencode ready"
      echo "installed: opencode $(opencode --version 2>/dev/null | tail -1)"
    verifyScript: |
      export PATH="$PATH:$HOME/.opencode/bin"
      command -v opencode >/dev/null 2>&1 && echo ready
    uninstallScript: |
      rm -rf "$HOME/.opencode"
      sudo rm -f /usr/local/bin/opencode
    updateCheckScript: ""
  - id: claude
    category: ai
    name: Claude Code
    description: >-
      Anthropic's Claude Code CLI coding agent, installed as a self-contained native build via the
      official installer. Bring an API key or a Claude subscription, then run `claude` in the terminal.
    supportedArches: [arm64]
    installScript: |
      set -e
      # Install the self-contained native build via Anthropic's official installer. npm is deliberately
      # NOT used: under proot's --link2symlink, npm hard-links the platform binary
      # (@anthropic-ai/claude-code-linux-arm64) and the hard link becomes a dangling ".l2s" symlink, so
      # the installed `claude` is broken ("No such file or directory"). The native build has no
      # node_modules and no hard links, so it sidesteps that entirely. HOME is pinned to /root so the
      # install matches the (root) terminal's HOME, keeping `claude update`, auth (~/.claude) and the
      # binary co-located.
      export HOME=/root
      command -v curl >/dev/null 2>&1 || jcode_apt 0 20 "Installing download prerequisites" curl ca-certificates
      jcode_progress 30 "Downloading Claude Code"
      curl -fsSL https://claude.ai/install.sh | bash
      # The installer drops the binary at $HOME/.local/bin/claude, which is on neither the verify PATH
      # nor the terminal's PATH — so symlink it onto the global PATH (mirrors the opencode entry).
      [ -x "$HOME/.local/bin/claude" ] || { echo "The Claude Code installer did not leave a binary in /root/.local/bin."; exit 1; }
      jcode_progress 90 "Putting claude on PATH"
      sudo ln -sf "$HOME/.local/bin/claude" /usr/local/bin/claude
      jcode_progress 100 "Claude Code ready"
      claude --version
    # Run --version rather than a presence check so a half-finished install can't report as ready.
    verifyScript: |
      claude --version >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo rm -f /usr/local/bin/claude
      for h in /root /home/*; do rm -rf "$h/.local/share/claude" "$h/.local/bin/claude" 2>/dev/null || true; done
    updateCheckScript: ""
  - id: codex
    category: ai
    name: Codex
    description: >-
      OpenAI's Codex CLI coding agent. Installed globally via npm (needs Node.js). Bring an OpenAI API
      key, then run `codex` in the terminal.
    supportedArches: [arm64]
    requiredSdks: [nodejs]
    installScript: |
      set -e
      command -v npm >/dev/null 2>&1 || { echo "Codex needs Node.js. Install the Node.js toolchain first."; exit 1; }
      jcode_progress 10 "Installing @openai/codex with npm"
      sudo npm install -g @openai/codex
      # npm installs into whichever nvm version is default, whose bin directory is not on PATH for
      # non-login shells — the same reason node/npm themselves are symlinked into /usr/local/bin.
      jcode_progress 90 "Putting codex on PATH"
      CODEX_BIN=$(dirname "$(readlink -f "$(command -v npm)")")/codex
      [ -x "$CODEX_BIN" ] && sudo ln -sf "$CODEX_BIN" /usr/local/bin/codex
      jcode_progress 100 "Codex ready"
      echo "installed: codex $(codex --version 2>/dev/null | tail -1)"
    verifyScript: |
      command -v codex >/dev/null 2>&1 && echo ready
    uninstallScript: |
      sudo npm rm -g @openai/codex 2>/dev/null || true
      sudo rm -f /usr/local/bin/codex
    updateCheckScript: ""
